# ars-fivem Convars Configuration
# =================================
# Auto-audited — only convars actually read by code are listed.
# Use: exec @ars-fivem/ars.cfg
#
# Conventions:
#   setr = replicated (sent to clients)
#   set  = server-only
#
# Default values shown in comments are the code fallback when the
# convar is not set (i.e. the hard-coded default in GetConvar calls).

# ========================================
# Shared / Cross-Resource
# ========================================

# Skip "up to date" print messages for all ars-fivem resources
# Used in: every resource's UpdateNotifier.lua
# Default: false (show updates)
setr ars_skip_uptodate_print "false"

# ========================================
# customphysics (cp)
# ========================================

# --- Wheelies ---

# Master toggle for wheelie physics
# Used in: customphysics/client/wheelies.lua:176
# Default: true
setr cp_wheelies_enabled "true"

# Restrict wheelies to muscle-class vehicles only
# Used in: customphysics/client/wheelies.lua:182
# Default: true
setr cp_wheelies_muscle_only "true"

# Disable native GTA wheelie control (let custom physics handle it)
# Used in: customphysics/client/wheelies.lua:71
# Default: true
setr cp_wheelies_native_disabled "true"

# --- Rollovers ---

# Master toggle for rollover physics
# Used in: customphysics/client/rollovers.lua:74
# Default: true
setr cp_rollovers_enabled "true"

# Minimum speed (m/s) to trigger a rollover
# Used in: customphysics/client/rollovers.lua:4
# Default: 8.94
setr cp_rollover_start_speed "8.94"

# Speed (m/s) required to keep a rollover going
# Used in: customphysics/client/rollovers.lua:5
# Default: 6.71
setr cp_rollover_keep_speed "6.71"

# Angular rotation (degrees) to trigger a rollover
# Used in: customphysics/client/rollovers.lua:6
# Default: 180.0
setr cp_rollover_start_rot "180.0"

# Angular rotation (degrees) to keep a rollover going
# Used in: customphysics/client/rollovers.lua:7
# Default: 90.0
setr cp_rollover_keep_rot "90.0"

# --- Off-road / Slides ---

# Enable off-road power boost
# Used in: customphysics/client/power.lua:355
# Default: true
setr cp_offroad_boost_enabled "true"

# Master toggle for powerslide power boost
# Used in: customphysics/client/power.lua:115
# Default: true
setr cp_slides_enabled "true"

# Maximum off-road power multiplier
# Used in: customphysics/client/power.lua:373
# Default: 5.0
setr cp_offroad_max_multiplier "5.0"

# --- Debug ---

# Debug print level (0=off, 1=normal, 2=verbose)
# Used in: customphysics/client/power.lua:502, rollovers.lua:217
# Default: 0
setr cPhysicsPrintLevel "0"

# ========================================
# performancetuning (pt)
# ========================================

# Cooldown between nitrous shots in milliseconds (0 = no cooldown)
# Used in: performancetuning/client/nitrous.lua:41
# Default: 0
setr pt_nitrous_shot_cooldown_ms "0"

# Comma-separated list of vehicle model names allowed for engine swaps
# Used in: performancetuning/client/runtimebindings.lua:42
# Default: "" (empty = no swaps)
setr pt_engine_swaps ""

# ========================================
# traffic_control (tControl)
# ========================================

# Default traffic density (0.0 = normal traffic)
# Used in: traffic_control/client/traffic_task.lua:22
# Default: "" (empty = no override)
setr tControlDefault "0.0"

# Print traffic control requests to console
# Used in: traffic_control/server/server.lua:9
# Default: false
set tControlPrintRequests "false"

